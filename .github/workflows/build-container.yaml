name: Build and publish container
on:
  workflow_dispatch:
    inputs:
      caddy_version:
        description: 'Caddy version to build (e.g. 2.11.7). Empty = latest'
        required: false
        type: string
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Caddy version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST=$(gh release list -R caddyserver/caddy --exclude-pre-releases --limit 1 \
            --json tagName --jq '.[0].tagName' | sed 's/^v//')
          VERSION="${{ inputs.caddy_version }}"
          [ -n "$VERSION" ] || VERSION="$LATEST"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid Caddy version '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          [ "$VERSION" = "$LATEST" ] && echo "is_latest=true" >> "$GITHUB_OUTPUT" || echo "is_latest=false" >> "$GITHUB_OUTPUT"
      - name: Skip if already published
        id: check
        run: |
          if docker manifest inspect ghcr.io/${{ github.repository_owner }}/caddy-ecs-encoder:${{ steps.version.outputs.version }} >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Caddy image on Docker Hub
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          docker manifest inspect docker.io/caddy:${{ steps.version.outputs.version }} >/dev/null
          docker manifest inspect docker.io/caddy:${{ steps.version.outputs.version }}-builder >/dev/null
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/caddy-ecs-encoder
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_latest == 'true' }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.is_latest == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_latest == 'true' }}
      - name: Set up QEMU
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64, linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
